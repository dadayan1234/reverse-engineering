[platformio]
default_envs = baseline

[env]
platform = espressif32@7.1.3
framework = espidf
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
monitor_speed = 115200

[env:baseline]
board_build.esp-idf.sdkconfig_path = sdkconfig.baseline
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=config/baseline/sdkconfig.defaults

[env:secure_boot]
board_build.esp-idf.sdkconfig_path = sdkconfig.secure_boot
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=config/secure_boot/sdkconfig.defaults

[env:flash_encryption]
board_build.esp-idf.sdkconfig_path = sdkconfig.flash_encryption
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=config/flash_encryption/sdkconfig.defaults

[env:full_security]
board_build.esp-idf.sdkconfig_path = sdkconfig.full_security
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=config/full_security/sdkconfig.defaults
