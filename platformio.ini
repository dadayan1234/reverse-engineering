[platformio]
default_envs = baseline

[env]
platform = espressif32@7.1.3
framework = espidf
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
monitor_speed = 115200
extra_scripts = pre:scripts/platformio_security_config.py

[env:baseline]
board_build.esp-idf.sdkconfig_path = sdkconfig.baseline

[env:secure_boot]
board_build.esp-idf.sdkconfig_path = sdkconfig.secure_boot

[env:flash_encryption]
board_build.esp-idf.sdkconfig_path = sdkconfig.flash_encryption
board_build.partitions = config/flash_encryption/partitions.recovery.csv

[env:full_security]
board_build.esp-idf.sdkconfig_path = sdkconfig.full_security
